[project]
name = "wallet-control"
version = "0.1.0"
description = "Agent on a Leash -- wallet control layer for the Viseca 2026 challenge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "hypothesis>=6.100",
    # Used only by scripts/run_vacuity_audit.py, which measures which assertions in
    # this suite have never actually run. Not imported by anything in src/.
    "coverage>=7.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
